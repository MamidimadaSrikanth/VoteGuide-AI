<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="VoteGuide AI — Your smart assistant for Indian election eligibility, registration, and polling information.">
    <title>VoteGuide AI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body style="background-color: #f4f4f4;">

    <h1>🗳️ VoteGuide AI</h1>
    <p class="tagline">Your smart assistant for Indian elections</p>

    <!-- ================= CHAT SECTION ================= -->
    <div class="chatbox">

        <div id="messages" aria-live="polite"></div>

        <!-- Input with label -->
        <label for="userInput">Ask a Question</label>
        <input type="text" id="userInput" aria-label="User input"
            placeholder="Ask about voting, eligibility, registration...">

        <br>

        <!-- Buttons -->
        <button id="btn-speak" aria-label="Speak input" onclick="startVoice()">🎤 Speak</button>
        <button id="btn-send" aria-label="Send message" onclick="sendMessage()">Send ➤</button>

    </div>

    <!-- ================= ELIGIBILITY ================= -->
    <h2>Check Eligibility</h2>

    <div class="section-card">

        <label for="age">Enter Age</label>
        <input type="number" id="age" aria-label="Enter age" placeholder="Enter your age">

        <label for="citizen">Citizenship</label>
        <select id="citizen" aria-label="Select citizenship">
            <option value="yes">Indian Citizen</option>
            <option value="no">Not a Citizen</option>
        </select>

        <br>

        <button id="btn-check" aria-label="Check eligibility" onclick="checkEligibility()">
            Check Eligibility
        </button>

    </div>

    <!-- ================= TIMELINE ================= -->
    <h2>Election Timeline</h2>

    <button id="btn-timeline" aria-label="Show election timeline" onclick="getTimeline()">
        Show Timeline
    </button>

    <div id="timeline" aria-live="polite"></div>

    <!-- ================= MAP ================= -->
    <h2>Find Polling Booth</h2>

    <iframe title="Polling booth location map" width="560" height="400" loading="lazy" style="border:0"
        src="https://www.google.com/maps?q=polling+booth+near+me&output=embed">
    </iframe>

    <!-- JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
