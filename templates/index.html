<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="VoteGuide AI — Your smart assistant for Indian election eligibility, registration, and polling information.">
    <title>VoteGuide AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body style="background-color: #f4f4f4;">

    <h1> VoteGuide AI</h1>
    <p class="tagline">Your smart assistant for Indian elections</p>

    <!-- Chat Section -->
    <div class="chatbox">
        <div id="messages"></div>
        <input type="text" id="userInput" placeholder="Ask about voting, eligibility, registration...">
        <br>
        <button id="btn-speak" onclick="startVoice()">Speak</button>
        <button id="btn-send" onclick="sendMessage()">Send ➤</button>
    </div>

    <!-- Eligibility Section -->
    <h2> Check Eligibility</h2>
    <div class="section-card">
        <input type="number" id="age" placeholder="Enter your age">
        <select id="citizen">
            <option value="yes">Indian Citizen</option>
            <option value="no">Not a Citizen</option>
        </select>
        <br>
        <button id="btn-check" onclick="checkEligibility()">Check Eligibility</button>
    </div>

    <!-- Timeline Section -->
    <h2> Election Timeline</h2>
    <button id="btn-timeline" onclick="getTimeline()">Show Timeline</button>
    <div id="timeline"></div>

    <!-- Polling Booth Map -->
    <h2> Find Polling Booth</h2>
    <iframe width="560" height="400" style="border:0" loading="lazy"
        src="https://www.google.com/maps?q=polling+booth+near+me&output=embed">
    </iframe>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
